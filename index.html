<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini API Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: auto;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 15px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
            min-height: 80px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <h2>Тест Gemini API</h2>

    <div class="form-group">
        <label for="apiKey">Gemini API Key (вставьте ключ сюда):</label>
        <!-- Поле пустое! Мы не сохраняем ключ в коде. -->
        <input type="password" id="apiKey" placeholder="AIzaSy...">
    </div>

    <div class="form-group">
        <label for="prompt">Ваш текстовый запрос:</label>
        <textarea id="prompt" rows="4" placeholder="Напишите ваш вопрос..."></textarea>
    </div>

    <button id="sendBtn">Отправить</button>

    <div id="result">Ответ от нейросети появится здесь...</div>

    <script>
        document.getElementById('sendBtn').addEventListener('click', async () => {
            // 1. Получаем ключ и текст прямо из полей ввода на странице
            const apiKey = document.getElementById('apiKey').value.trim();
            const prompt = document.getElementById('prompt').value.trim();
            const resultDiv = document.getElementById('result');

            // 2. Проверяем, ввел ли пользователь данные
            if (!apiKey) {
                alert('Пожалуйста, вставьте ваш API ключ!');
                return;
            }
            if (!prompt) {
                alert('Пожалуйста, введите запрос!');
                return;
            }

            resultDiv.innerText = 'Загрузка...';

            try {
                // 3. Формируем URL, подставляя ключ из переменной apiKey
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

                // 4. Отправляем запрос
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();

                // 5. Выводим результат
                if (response.ok) {
                    resultDiv.innerText = data.candidates[0].content.parts[0].text;
                } else {
                    resultDiv.innerText = 'Ошибка: ' + (data.error?.message || 'Неизвестная ошибка');
                }
            } catch (error) {
                resultDiv.innerText = 'Сетевая ошибка: ' + error.message;
            }
        });
    </script>
</body>
</html>
